server:
  port: 8080

spring:
  application:
    name: officeflow

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  token-secret: ${APP_TOKEN_SECRET}
  cors-origins: ${APP_CORS_ORIGINS}