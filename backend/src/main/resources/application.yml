server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: flowos
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flowos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

app:
  token-secret: ${APP_TOKEN_SECRET:flowos-local-dev-secret-key-minimum-32-chars}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  open-member-signup: ${APP_OPEN_MEMBER_SIGNUP:false}
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
