services:
  mysql:
    image: mysql:8.4
    container_name: flowos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flowos
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - flowos-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  flowos-mysql-data:
